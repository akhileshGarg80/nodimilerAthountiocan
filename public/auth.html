<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth System with Nodemailer & JWT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; borderRadius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .box { margin-bottom: 20px; }
    .hidden { display: none; }
    .msg { color: green; font-weight: bold; }
    .err { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Auth System</h2>
  <div id="message"></div>

  <!-- Register Box -->
  <div id="registerBox" class="box">
    <h3>Register</h3>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <button onclick="handleRegister()">Send Registration OTP</button>
    <p>Already have an account? <a href="#" onclick="showBox('loginBox')">Login</a></p>
  </div>

  <!-- OTP Verification Box -->
  <div id="otpBox" class="box hidden">
    <h3>Verify OTP</h3>
    <input type="text" id="otpValue" placeholder="Enter 6-digit OTP">
    <button onclick="handleVerifyOtp()">Verify & Auto Login</button>
  </div>

  <!-- Login Box -->
  <div id="loginBox" class="box hidden">
    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <p><a href="#" onclick="showBox('forgotBox')">Forgot Password?</a></p>
    <p>Need an account? <a href="#" onclick="showBox('registerBox')">Register</a></p>
  </div>

  <!-- Forgot Password Box -->
  <div id="forgotBox" class="box hidden">
    <h3>Forgot Password</h3>
    <input type="email" id="forgotEmail" placeholder="Enter Email">
    <button onclick="handleForgotPassword()">Send OTP</button>
    <p><a href="#" onclick="showBox('loginBox')">Back to Login</a></p>
  </div>

  <!-- Reset Password Box -->
  <div id="resetBox" class="box hidden">
    <h3>Reset Password</h3>
    <input type="text" id="resetOtp" placeholder="Enter OTP">
    <input type="password" id="newPassword" placeholder="New Password">
    <button onclick="handleResetPassword()">Reset & Auto Login</button>
  </div>

  <!-- Profile Box -->
  <div id="profileBox" class="box hidden">
    <h3>User Profile</h3>
    <p><strong>Email:</strong> <span id="profileEmail"></span></p>
    <button onclick="handleLogout()" style="background-color: red;">Logout</button>
  </div>

  <script>
    const API = '/api/auth';
    let currentEmail = '';

    function showBox(boxId) {
      ['registerBox', 'otpBox', 'loginBox', 'forgotBox', 'resetBox', 'profileBox'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(boxId).classList.remove('hidden');
      document.getElementById('message').innerText = '';
    }

    function setMessage(text, isError = false) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerText = text;
      msgDiv.className = isError ? 'err' : 'msg';
    }

    function saveTokenAndShowProfile(token, email) {
      localStorage.setItem('token', token);
      document.getElementById('profileEmail').innerText = email;
      showBox('profileBox');
    }

    async function handleRegister() {
      currentEmail = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const res = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, password })
      });
      const data = await res.json();
      setMessage(data.message, !res.ok);
      if (res.ok) showBox('otpBox');
    }

    async function handleVerifyOtp() {
      const otp = document.getElementById('otpValue').value;
      const res = await fetch(`${API}/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, otp })
      });
      const data = await res.json();
      setMessage(data.message, !res.ok);
      if (res.ok) saveTokenAndShowProfile(data.token, data.user.email);
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      setMessage(data.message, !res.ok);
      if (res.ok) saveTokenAndShowProfile(data.token, data.user.email);
    }

    async function handleForgotPassword() {
      currentEmail = document.getElementById('forgotEmail').value;
      const res = await fetch(`${API}/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail })
      });
      const data = await res.json();
      setMessage(data.message, !res.ok);
      if (res.ok) showBox('resetBox');
    }

    async function handleResetPassword() {
      const otp = document.getElementById('resetOtp').value;
      const newPassword = document.getElementById('newPassword').value;
      const res = await fetch(`${API}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, otp, newPassword })
      });
      const data = await res.json();
      setMessage(data.message, !res.ok);
      if (res.ok) saveTokenAndShowProfile(data.token, data.user.email);
    }

    function handleLogout() {
      localStorage.removeItem('token');
      showBox('loginBox');
      setMessage('Logged out successfully!');
    }

    // Auto load profile if token exists
    window.onload = async () => {
      const token = localStorage.getItem('token');
      if (token) {
        const res = await fetch(`${API}/profile`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('profileEmail').innerText = data.user.email;
          showBox('profileBox');
        } else {
          localStorage.removeItem('token');
          showBox('loginBox');
        }
      } else {
        showBox('loginBox');
      }
    };
  </script>
</body>
</html>
