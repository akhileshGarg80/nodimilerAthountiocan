<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auth OTP Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h2 { margin-top: 0; text-align: center; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .msg { margin-top: 14px; text-align: center; font-size: 14px; min-height: 20px; }
  .success { color: #4ade80; }
  .error { color: #f87171; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    background: #0f172a;
    font-size: 13px;
  }
  .tab.active { background: #6366f1; }
  .hidden { display: none; }
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #6366f1;
    margin: 8px auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: white;
  }
  .profile-name { text-align: center; font-size: 18px; font-weight: 600; }
  .profile-email { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Auth Demo</h2>
    <div class="tabs">
      <div class="tab active" data-tab="register">Register</div>
      <div class="tab" data-tab="login">Login</div>
    </div>

    <!-- Register + OTP flow -->
    <div id="register-panel">
      <div id="register-step">
        <input id="reg-name" placeholder="Naam" />
        <input id="reg-email" placeholder="Email" type="email" />
        <input id="reg-password" placeholder="Password" type="password" />
        <button id="reg-btn">OTP Bhejein</button>
      </div>
      <div id="otp-step" class="hidden">
        <input id="otp-code" placeholder="6-digit OTP" maxlength="6" />
        <button id="otp-btn">Verify OTP</button>
        <button id="resend-btn" style="background:#334155; margin-top:8px;">Resend OTP</button>
      </div>
    </div>

    <!-- Login -->
    <div id="login-panel" class="hidden">
      <input id="login-email" placeholder="Email" type="email" />
      <input id="login-password" placeholder="Password" type="password" />
      <button id="login-btn">Login</button>
    </div>

    <!-- Profile (shown after auto-login) -->
    <div id="profile-panel" class="hidden">
      <div class="profile-avatar" id="profile-avatar"></div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-email" id="profile-email"></div>
      <button id="logout-btn" style="background:#334155;">Logout</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

<script>
const API = '/api/auth';
let currentEmail = '';

const msgEl = document.getElementById('msg');
const showMsg = (text, isError = false) => {
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (isError ? 'error' : 'success');
};

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isRegister = tab.dataset.tab === 'register';
    document.getElementById('register-panel').classList.toggle('hidden', !isRegister);
    document.getElementById('login-panel').classList.toggle('hidden', isRegister);
    msgEl.textContent = '';
  });
});

const setLoading = (btn, loading) => {
  btn.disabled = loading;
  btn.dataset.original = btn.dataset.original || btn.textContent;
  btn.textContent = loading ? '...' : btn.dataset.original;
};

// Register/Login/OTP panels chhupa ke profile dikhate hain (auto-login ke baad)
const showProfile = (user) => {
  document.querySelector('.tabs').classList.add('hidden');
  document.getElementById('register-panel').classList.add('hidden');
  document.getElementById('login-panel').classList.add('hidden');
  document.getElementById('profile-panel').classList.remove('hidden');

  document.getElementById('profile-name').textContent = user.name;
  document.getElementById('profile-email').textContent = user.email;
  document.getElementById('profile-avatar').textContent = user.name
    ? user.name.trim().charAt(0).toUpperCase()
    : '?';
};

// Page load pe agar token already stored hai, seedha profile fetch karke dikhayein
const tryAutoLogin = async () => {
  const token = localStorage.getItem('token');
  if (!token) return;

  try {
    const res = await fetch(`${API}/me`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    if (data.success) {
      showProfile(data.user);
    } else {
      localStorage.removeItem('token');
    }
  } catch (err) {
    // network issue — login screen par hi rehne dete hain
  }
};
tryAutoLogin();

// Register -> send OTP
document.getElementById('reg-btn').addEventListener('click', async () => {
  const btn = document.getElementById('reg-btn');
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  if (!name || !email || !password) return showMsg('Sabhi fields bharein', true);

  setLoading(btn, true);
  try {
    const res = await fetch(`${API}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (data.success) {
      currentEmail = email;
      document.getElementById('register-step').classList.add('hidden');
      document.getElementById('otp-step').classList.remove('hidden');
      showMsg('OTP aapke email par bhej diya gaya hai');
    } else {
      showMsg(data.message, true);
    }
  } catch (err) {
    showMsg('Network error', true);
  } finally {
    setLoading(btn, false);
  }
});

// Verify OTP
document.getElementById('otp-btn').addEventListener('click', async () => {
  const btn = document.getElementById('otp-btn');
  const otp = document.getElementById('otp-code').value.trim();
  if (!otp) return showMsg('OTP daalein', true);

  setLoading(btn, true);
  try {
    const res = await fetch(`${API}/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail, otp }),
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('token', data.token);
      showMsg('Verification successful! Login ho gaye.');
      showProfile(data.user);
    } else {
      showMsg(data.message, true);
    }
  } catch (err) {
    showMsg('Network error', true);
  } finally {
    setLoading(btn, false);
  }
});

// Resend OTP
document.getElementById('resend-btn').addEventListener('click', async () => {
  const btn = document.getElementById('resend-btn');
  setLoading(btn, true);
  try {
    const res = await fetch(`${API}/resend-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail }),
    });
    const data = await res.json();
    showMsg(data.message, !data.success);
  } catch (err) {
    showMsg('Network error', true);
  } finally {
    setLoading(btn, false);
  }
});

// Login
document.getElementById('login-btn').addEventListener('click', async () => {
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showMsg('Email aur password bharein', true);

  setLoading(btn, true);
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('token', data.token);
      showMsg('Login successful!');
      showProfile(data.user);
    } else {
      showMsg(data.message, true);
    }
  } catch (err) {
    showMsg('Network error', true);
  } finally {
    setLoading(btn, false);
  }
});

// Logout
document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('token');
  document.getElementById('profile-panel').classList.add('hidden');
  document.querySelector('.tabs').classList.remove('hidden');
  document.getElementById('login-panel').classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="login"]').classList.add('active');
  msgEl.textContent = '';
});
</script>
</body>
</html>
